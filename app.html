<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reclick</title>
    <style>
        * {
            background-color: rgb(6, 4, 6);
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        button {
            padding: 4px;
            border: 1px solid white;
            border-radius: 4px;
            background: rgba(0, 0, 0, 1.0);
            transition: background 0.1s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        button:active {
            background: rgba(0, 0, 0, 0);
        }



        .glowy {
            text-shadow: 0px 0px 30px;
        }

        .crt {
            filter: saturate(25) brightness(0.5) contrast(1.8) brightness(4.5);
        }

        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(16, 18, 18, 0.1);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            /* background: linear-gradient(rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg,
                    rgba(255, 0, 0, 0.02),
                    rgba(0, 255, 255, 0.07),
                    rgba(0, 0, 255, 0.02)); */
            background: linear-gradient(rgba(18, 18, 16, 0) 50%,
                    rgba(0, 4, 4, 0.2) 50%),
                linear-gradient(90deg,
                    rgba(255, 255, 0, 0.02),
                    rgba(255, 0, 255, 0.02),
                    rgba(0, 255, 255, 0.02));
            z-index: 2;
            background-size: 100% 5px, 5px 100%;
            pointer-events: none;
        }

        html {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            padding: 0rem;
        }

        #top_bar {
            height: 2rem;
        }
        #top_bar {
            width: 100vw;
            border-bottom: 1px solid white;
        }

        #title {
            height: 2rem;
            line-height: 2rem;
            font-size: 1.5rem;
            margin-left: 0.3rem;
            display: inline-block;
            text-align: left;
            justify-content: center;
            justify-self: center;
            margin-right:  auto;
        }

        #repatch_status {
            margin-left: 8px;
        }

        #repatch_section {
            width: calc(100vw - 2rem);
            border-bottom: 1px solid white;
            padding: 1rem;
        }
    </style>
</head>

<body class="crt">
    <div id="top_bar">
        <h1 id="title" class="glowy">reclick</h1>
    </div>
    <div id="repatch_section">
        <button>Repatch Library</button>
        <span id="repatch_status">Last repatch was 6 seconds ago.</span>
    </div>
    <button onclick="pywebview.api.hello_world('test')">this is a button</button>
    <!-- ---THISISAVALIDFILEALLISGOOD--- -->
    <script>
        //setTimeout(()=>{location.reload()}, 5000);
    </script>
</body>

</html>
