<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reclick</title>
    <style>
        * {
            background-color: rgb(6, 4, 6);
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        button {
            padding: 4px;
            border: 1px solid white;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 1.0);
            transition: background-color 0.1s;
            cursor: pointer;
        }

        button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        button:active {
            background-color: rgba(0, 0, 0, 0);
        }



        .glowy {
            text-shadow: 0px 0px 30px;
        }

        .crt {
            filter: saturate(25) brightness(0.5) contrast(1.8) brightness(4.5);
        }

        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(16, 18, 18, 0.1);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            /* background: linear-gradient(rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg,
                    rgba(255, 0, 0, 0.02),
                    rgba(0, 255, 255, 0.07),
                    rgba(0, 0, 255, 0.02)); */
            background: linear-gradient(rgba(18, 18, 16, 0) 50%,
                    rgba(0, 4, 4, 0.2) 50%),
                linear-gradient(90deg,
                    rgba(255, 255, 0, 0.02),
                    rgba(255, 0, 255, 0.02),
                    rgba(0, 255, 255, 0.02));
            z-index: 2;
            background-size: 100% 5px, 5px 100%;
            pointer-events: none;
        }

        html {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            padding: 0rem;
        }

        #top_bar {
            height: 3rem;
        }
        #top_bar {
            width: 100vw;
            border-bottom: 1px solid white;
        }

        #title {
            height: 3rem;
            line-height: 3rem;
            font-size: 2.5rem;
            margin-left: 0.4rem;
            display: inline-block;
            text-align: left;
            justify-content: center;
            justify-self: center;
            margin-right:  auto;
        }

        #repatch_status {
            margin-left: 8px;
        }

        #repatch_section {
            width: calc(100vw - 1rem);
            border-bottom: 1px solid white;
            padding: 0.5rem;
            height: 1.5rem;
        }

        #bottom_container {
            height: calc(100vh - 5.5rem - 2px);
            width: 100vw;
        }

        #sectioner {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border-collapse: collapse;
        }

        tr {
            border-collapse: collapse;
        }

        #left {
            border-right: 1px solid white;
            overflow-y: scroll;
            width: 50%;
            align-content: start;
            padding: 1rem;
        }

        ::-webkit-scrollbar {
            visibility: hidden;
            display: none;
        }

        .game {
            border: 1px solid white;
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
        }

        .game h3, .game small {
            white-space: nowrap;
        }

        .launch_btn {
            margin-left: 0.5rem;
        }
    </style>
</head>

<body class="crt">
    <div id="top_bar">
        <h1 id="title" class="glowy">reclick</h1>
    </div>
    <div id="repatch_section">
        <button>Repatch Library</button>
        <span id="repatch_status">Last repatch was 6 seconds ago.</span>
    </div>
    
    <div id="bottom_container">
        <table id="sectioner">
            <tr>
                <td id="left">
                    <div class="game">
                        <table>
                            <tr>
                                <td style="width: 100%">
                                    <h3>Rounds.exe</h3>
                                    <small>AppID: 480 | Unity, BepInEx, PhotonPUN</small>
                                </td>
                                <td>
                                    <button class="launch_btn">Launch</button>
                                </td>
                            </tr>
                        </table>
                    </div>
                </td>
                <td id="right">
                    <button>⚂</button>
                </td>
            </tr>
        </table>
    </div>


    <!-- ---THISISAVALIDFILEALLISGOOD--- -->
    <script>
        //setTimeout(()=>{location.reload()}, 5000);
    </script>
</body>

</html>
