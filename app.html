<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reclick</title>
    <style>
        * {
            background-color: black;
            color: white;
            font-family: monospace;
            margin: 0;
            padding: 0;
        }

        .glowy {
            text-shadow: 0px 0px 30px;
        }

        .crt {
            filter: saturate(25) brightness(0.5) contrast(1.8) brightness(3.2);
        }

        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(16, 18, 18, 0.1);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            /* background: linear-gradient(rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg,
                    rgba(255, 0, 0, 0.02),
                    rgba(0, 255, 255, 0.07),
                    rgba(0, 0, 255, 0.02)); */
            background: linear-gradient(rgba(18, 18, 16, 0) 50%,
                    rgba(0, 4, 4, 0.25) 50%),
                linear-gradient(90deg,
                    rgba(255, 255, 0, 0.03),
                    rgba(255, 0, 255, 0.03),
                    rgba(0, 255, 255, 0.03));
            z-index: 2;
            background-size: 100% 5px, 5px 100%;
            pointer-events: none;
        }
        
        div {
            transform: translate(-50%, -50%) scale(1.0);
            transition: transform 0.5s;
        }

        div:hover {
            transform: translate(-50%, -50%) scale(1.02);
        }

        html {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            width: calc(100vw - 4rem);
            height: calc(100vh - 4rem);
            padding: 2rem;
        }
    </style>
</head>

<body class="crt">
    <h1>plswork</h1>
    <button onclick="pywebview.api.hello_world('test')">this is a button</button>
    <!-- ---THISISAVALIDFILEALLISGOOD--- -->
</body>

</html>
