<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>retcon4</title>
        <link rel="stylesheet" href="web/style.css">
    </head>

    <body class="crt">
        <div id="top_bar">
            <h1 id="title" class="glowy">retcon4</h1>
        </div>
        <div id="repatch_section">
            <button id="repatch_btn">Virtual LAN Fix</button>
            <span style="float: right">
                Network Interface:
                <select data-setting="HostAddress">
                    <option>todo: add NIC select option here</option>
                </select>
            </span>
        </div>

        <div id="bottom_container">
            <table id="sectioner">
                <tr>
                    <td id="leftOuter">
                        <div id="left">
                            <div class="game">
                                <table>
                                    <tr>
                                        <td style="width: 100%">
                                            <h3>Loading...</h3>
                                            <small
                                                >If this takes more than a second smth broke</small
                                            >
                                        </td>
                                        <td>
                                            <button class="launch_btn">
                                                Wait
                                            </button>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </td>
                    <td id="right">
                        username: <input data-setting="Username" /><br />
                        steam id: <input data-setting="SteamID" />
                        <button id="randomise_steam_id">⚂</button><br />
                        custom photon server:
                        <input data-setting="PhotonHost" /><br />
                        replace steam GSE DLLs:
                        <input data-setting="ReplaceSteamAPI" /><br />
                        <br />
                        <small>pretend there are other game settings here</small
                        ><br />
                        <button id="escape">escape the settings menu</button>
                    </td>
                </tr>
            </table>
        </div>

        <div id="devlogs">RECLICK v4</div>

        <!-- ---THISISAVALIDFILEALLISGOOD--- -->
        <script>
            let games = {};
            let games_internal = [];
            const waitForPywebview = async () => {
                return new Promise((resolve) => {
                    const interval = setInterval(() => {
                        if (
                            typeof pywebview !== "undefined" &&
                            pywebview.api &&
                            Object.keys(pywebview.api).length > 0
                        ) {
                            clearInterval(interval);
                            resolve();
                        }
                    }, 50);
                });
            };
            const logs_buffer = ["RECLICK v4"];
            const logs = document.querySelector("#devlogs");
            function log_to_console(x) {
                logs_buffer.push(x);
                if (logs_buffer.length > 40) {
                    logs_buffer.splice(0, 1);
                }
                logs.innerText = "";
                draw_bg();
                console.log(x);
            }
            async function draw_bg() {
                logs.innerText = "";
                for (let i = 0; i < logs_buffer.length; i++) {
                    await sleep(100);
                    logs.innerText += logs_buffer[i] + "\n";
                }
            }
            const ignorelist = ["vmware", "virtual", "vm", "vir"];
            const nameMapping = {
                ham: "Hamachi",
                wlp: "WiFi",
                wlan: "WiFi",
                eth: "Ethernet",
                en: "Ethernet",
                lo: "Local",
            };
            async function update_nic_list(inCf) {
                const conf = inCf || (await window.pywebview.api.read_cfg());
                const targetAddress = conf["HostAddress"];
                const nics = await window.pywebview.api.get_nics();
                const dropdown = document.querySelector(
                    "[data-setting=HostAddress]",
                );
                dropdown.innerHTML = "";
                Object.entries(nics).forEach((ent) => {
                    let rawName = ent[0];
                    let chkName = ent[0].toLowerCase();
                    let displayName = ent[0];
                    const addresses = ent[1];
                    for (let i = 0; i < ignorelist.length; i++) {
                        if (chkName.includes(ignorelist[i])) {
                            return;
                        }
                    }
                    Object.entries(nameMapping).forEach((mapper) => {
                        if (chkName.startsWith(mapper[0])) {
                            displayName = mapper[1];
                        }
                    });
                    addresses.forEach((addr) => {
                        const opt = document.createElement("option");
                        opt.value = addr;
                        opt.innerText = `${displayName}: ${addr}`;
                        opt.selected = targetAddress === addr;
                        dropdown.appendChild(opt);
                    });
                });
            }
            async function load_cfg(inCf) {
                const conf = inCf || (await window.pywebview.api.read_cfg());
                await update_nic_list();
                Object.entries(conf).forEach((ent) => {
                    const settingTarget = document.querySelector(
                        `[data-setting="${ent[0]}"]`,
                    );
                    if (settingTarget) {
                        settingTarget.value = ent[1];
                        settingTarget.onblur = () => {
                            reload_cfg();
                        };
                        settingTarget.onkeydown = (e) => {
                            if (e.key === "Enter") {
                                settingTarget.blur();
                            }
                        };
                    }
                });
                return conf;
            }
            async function reload_cfg(inCf) {
                const conf = inCf || (await window.pywebview.api.read_cfg());
                [...document.querySelectorAll(`[data-setting]`)].forEach(
                    (setting) => {
                        conf[setting.getAttribute("data-setting")] =
                            setting.value.trim();
                    },
                );
                console.log(conf);
                await window.pywebview.api.write_cfg(conf);
                await load_cfg(conf);
                return conf;
            }
            let has_frida = false;
            let selectedGame = null;
            addEventListener("load", init);
            async function init() {
                await waitForPywebview();
                has_frida = await window.pywebview.api.has_frida();
                await update_games_internal();
                redraw_games();
                await load_cfg();
                await window.pywebview.api.internal_update_library();
                if (true) {
                    await update_games_internal();
                    redraw_games();
                }
            }
            async function update_games_internal() {
                games = await window.pywebview.api.get_library();
                games_internal = Object.entries(games).map((ent) =>
                    Object.assign({ ConfigPath: ent[0] }, JSON.parse(ent[1])),
                );
            }
            document
                .querySelector("#repatch_btn")
                .addEventListener("click", async () => {});
            const buttonMaps = new Map();
            function get_launcher_button(
                cfgPath,
                text,
                extraLaunchArgs,
                prefix,
            ) {
                if (!buttonMaps.has(cfgPath)) {
                    buttonMaps.set(cfgPath, []);
                }
                const launchBtn = document.createElement("button");
                launchBtn.classList.add("launch_btn");
                launchBtn.innerText = text;
                launchBtn.addEventListener("click", async () => {
                    if (launchBtn.classList.contains("disabled")) {
                        await window.pywebview.api.close_async(
                            JSON.parse(games[cfgPath]),
                        );
                        launchBtn.blur();
                        return;
                    }
                    launchBtn.blur();
                    try {
                        log_to_console(`Launching cfg: ${cfgPath}`);
                        log_to_console(games[cfgPath]);
                        buttonMaps
                            .get(cfgPath)
                            .forEach((button) =>
                                button.classList.add("disabled"),
                            );
                        await window.pywebview.api.launch_async(
                            cfgPath,
                            JSON.parse(games[cfgPath]),
                            true,
                            extraLaunchArgs || [],
                            prefix || [],
                        );
                        log_to_console("Game exited!");
                        buttonMaps
                            .get(cfgPath)
                            .forEach((button) =>
                                button.classList.remove("disabled"),
                            );
                    } catch (error) {
                        buttonMaps
                            .get(cfgPath)
                            .forEach((button) =>
                                button.classList.remove("disabled"),
                            );
                    }
                });
                buttonMaps.get(cfgPath).push(launchBtn);
                return launchBtn;
            }
            const INTERNALS = ["PhotonServer4", "PhotonServer5"];
            const is_internal = (tags) =>
                INTERNALS.reduce(
                    (prevVal, tag) => prevVal || tags.includes(tag),
                    false,
                );
            const game_entry_map = new Map();
            function draw_game(gameEntry, left) {
                if (game_entry_map.has(gameEntry[0])) {
                    left.appendChild(game_entry_map.get(gameEntry[0]));
                    return;
                }
                try {
                    const cfgPath = gameEntry[0];
                    const json = gameEntry[1];
                    const gameContainer = document.createElement("div");
                    if (cfgPath === selectedGame) {
                        gameContainer.classList.add("selected");
                    }
                    gameContainer.addEventListener("click", (e) => {
                        if (e.target.tagName.toLowerCase() === "button") {
                            return;
                        }
                        document.body.classList.toggle("changingsettings");
                        [...document.querySelectorAll(".selected")].forEach(
                            (x) => x.classList.remove("selected"),
                        );
                        gameContainer.classList.add("selected");
                        selectedGame = cfgPath;
                    });
                    gameContainer.classList.add("game");
                    const intern = is_internal(json.Tags);
                    if (intern) {
                        gameContainer.classList.add("internal");
                    }
                    const gameContentWrapper = document.createElement("table");
                    gameContainer.appendChild(gameContentWrapper);
                    const gameContent = document.createElement("tr");
                    gameContentWrapper.appendChild(gameContent);
                    const gameDetails = document.createElement("td");
                    const launchWrapper = document.createElement("td");
                    gameContent.appendChild(gameDetails);
                    gameDetails.style.width = "100%";
                    gameContent.appendChild(launchWrapper);

                    const gameTitle = document.createElement("h3");
                    const parts = json.GamePath.split("/")
                        .map((x) => x.split("\\"))
                        .flat();
                    gameTitle.innerText = parts[parts.length - 1].replace(
                        ".exe",
                        "",
                    );
                    gameDetails.appendChild(gameTitle);
                    const gameInfo = document.createElement("small");
                    gameInfo.innerText = `${json.AppID !== 0 ? `AppID: ${json.AppID} | ` : ""}${json.Tags.join(", ") || "No Tags"}`;
                    gameDetails.appendChild(gameInfo);
                    const hasPhoton4 = games_internal.find((x) =>
                        x.Tags.includes("PhotonServer4"),
                    );
                    const hasPhoton5 = games_internal.find((x) =>
                        x.Tags.includes("PhotonServer5"),
                    );
                    if (json.Tags.includes("Positron") && hasPhoton4) {
                        launchWrapper.style.minWidth = "9rem";
                        launchWrapper.appendChild(
                            get_launcher_button(
                                games_internal.find((x) =>
                                    x.Tags.includes("PhotonServer4"),
                                ).ConfigPath,
                                "Host",
                                ["/run", "LoadBalancing"],
                            ),
                        );
                    } else if (
                        json.Tags.includes("PhotonServerSettings") &&
                        hasPhoton5
                    ) {
                        launchWrapper.style.minWidth = "9rem";
                        if (has_frida) {
                            launchWrapper.appendChild(
                                get_launcher_button(
                                    games_internal.find((x) =>
                                        x.Tags.includes("PhotonServer5"),
                                    ).ConfigPath,
                                    "Host",
                                    [
                                        "-l",
                                        "hook.js",
                                        "--",
                                        "/run",
                                        "LoadBalancing",
                                    ],
                                    ["frida", "-f"],
                                ),
                            );
                        } else {
                            const fridaBtn = document.createElement("button");
                            fridaBtn.innerText = "Host ⚠";
                            fridaBtn.addEventListener("click", () => {
                                alert(
                                    "You need to install frida-tools into python to self-host Photon v5",
                                );
                            });
                            launchWrapper.appendChild(fridaBtn);
                        }
                    }

                    const launchBtn = get_launcher_button(
                        cfgPath,
                        intern ? "Test" : "Play",
                    );
                    launchWrapper.appendChild(launchBtn);
                    game_entry_map.set(cfgPath, gameContainer);
                    left.appendChild(gameContainer);
                } catch (error) {
                    console.error(error);
                }
            }
            function redraw_games() {
                const left = document.querySelector("#left");
                const oldScroll = left.scrollTop;
                [...document.querySelectorAll(".game")].forEach((x) =>
                    x.remove(),
                );

                Object.entries(games)
                    .map((ent) => [ent[0], JSON.parse(ent[1])])
                    .sort(
                        (a, b) =>
                            is_internal(a[1].Tags) - is_internal(b[1].Tags),
                    )
                    .forEach((ent) => {
                        selectedGame ||= ent[0];
                        draw_game(ent, left);
                    });
                log_to_console("Redrew games panel");
            }
            addEventListener("keydown", (e) => {
                if (e.key === "p") {
                    redraw_games();
                }
            });
            function sleep(ms) {
                return new Promise((res, rej) => {
                    setTimeout(() => {
                        res();
                    }, ms);
                });
            }
            const repatchBtn = document.querySelector("#repatch_btn");
            repatchBtn.addEventListener("click", async (e) => {
                if (repatchBtn.classList.contains("disabled")) {
                    return;
                }
                repatchBtn.classList.add("disabled");
                await sleep(100);
                await window.pywebview.api.lanpatch(
                    document.querySelector("[data-setting=HostAddress]")
                        .value || "",
                );
                repatchBtn.classList.remove("disabled");
            });
            document.querySelector("#escape").addEventListener("click", () => {
                document.body.classList.remove("changingsettings");
            });
            document
                .querySelector("#randomise_steam_id")
                .addEventListener("click", async (e) => {
                    document.querySelector("[data-setting=SteamID]").value =
                        await window.pywebview.api.generate_steam_id();
                    document.querySelector("[data-setting=SteamID]").select();
                    document.querySelector("[data-setting=SteamID]").blur();
                });
        </script>
    </body>
</html>
