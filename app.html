<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reclick</title>
    <style>
        * {
            background-color: rgb(6, 4, 6);
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        button {
            padding: 4px;
            border: 1px solid white;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0);
            transition: background-color 0.1s;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(65, 65, 65);
        }

        button:active {
            background-color: rgb(52, 52, 52);
        }



        .glowy {
            text-shadow: 0px 0px 30px;
        }

        .crt {
            filter: saturate(25) brightness(0.5) contrast(1.8) brightness(7);
        }

        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(16, 18, 18, 0.1);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            /* background: linear-gradient(rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg,
                    rgba(255, 0, 0, 0.02),
                    rgba(0, 255, 255, 0.07),
                    rgba(0, 0, 255, 0.02)); */
            background: linear-gradient(rgba(18, 18, 16, 0) 50%,
                    rgba(0, 4, 4, 0.2) 50%),
                linear-gradient(90deg,
                    rgba(255, 255, 0, 0.02),
                    rgba(255, 0, 255, 0.02),
                    rgba(0, 255, 255, 0.02));
            z-index: 2;
            background-size: 100% 5px, 5px 100%;
            pointer-events: none;
        }

        html {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            padding: 0rem;
        }

        #top_bar {
            height: 3rem;
        }
        #top_bar {
            width: 100vw;
            border-bottom: 1px solid white;
        }

        #title {
            height: 3rem;
            line-height: 3rem;
            font-size: 2.5rem;
            margin-left: 0.4rem;
            display: inline-block;
            text-align: left;
            justify-content: center;
            justify-self: center;
            margin-right:  auto;
        }

        #repatch_status {
            margin-left: 8px;
        }

        #repatch_section {
            width: calc(100vw - 1rem);
            border-bottom: 1px solid white;
            padding: 0.5rem;
            height: 1.5rem;
        }

        #bottom_container {
            height: calc(100vh - 5.5rem - 2px);
            width: 100vw;
        }

        #sectioner {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border-collapse: collapse;
        }

        tr {
            border-collapse: collapse;
        }

        #leftOuter {
            border-right: 1px solid white;
            width: 50%;
            align-content: start;
            padding: 0;
            margin: 0;
        }

        #left {
            height: calc(100vh - 5.5rem - 2px - 2rem);
            width: calc(100% - 2rem);
            overflow-x: hidden;
            overflow-y: scroll;
            margin: 0;
            padding: 1rem;
        }

        ::-webkit-scrollbar {
            visibility: hidden;
            display: none;
        }

        .game {
            border: 1px solid white;
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .game:last-child {
            margin-bottom: 0rem;
        }

        .game h3, .game small {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            max-width: 40vw;
            text-overflow: ellipsis;
        }
        .game small {
            max-width: 40vw;
        }

        @media only screen and (max-width: 600px) {
            #right {
                display: none;
            }
        }

        .launch_btn {
            display: inline-block;
            font-size: 1.25rem;
            height: calc(100% - 1rem);
            margin-left: 0.5rem;
            width: 4rem;
        }

        button.disabled {
            opacity: 55%;
        }
    </style>
</head>

<body class="crt">
    <div id="top_bar">
        <h1 id="title" class="glowy">retcon4</h1>
    </div>
    <div id="repatch_section">
        <button>Repatch Library</button>
        <span id="repatch_status">Last repatch was 6 seconds ago.</span>
    </div>
    
    <div id="bottom_container">
        <table id="sectioner">
            <tr>
                <td id="leftOuter">
                    <div id="left">
                        <div class="game">
                            <table>
                                <tr>
                                    <td style="width: 100%">
                                        <h3>Rounds.exe</h3>
                                        <small>AppID: 480 | Unity, BepInEx, PhotonPUN</small>
                                    </td>
                                    <td>
                                        <button class="launch_btn">play</button>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </td>
                <td id="right">
                    <button>⚂</button>
                </td>
            </tr>
        </table>
    </div>


    <!-- ---THISISAVALIDFILEALLISGOOD--- -->
    <script>
        let games = {};
        const waitForPywebview = async () => {
        return new Promise((resolve) => {
            const interval = setInterval(() => {
            if (typeof pywebview !== 'undefined' && pywebview.api && Object.keys(pywebview.api).length > 0) {
                clearInterval(interval);
                resolve();
            }
            }, 50);
        });
        };
        addEventListener("load", init);
        async function init() {
            await waitForPywebview();
            games = await window.pywebview.api.get_library();
            redraw_games();
            await window.pywebview.api.internal_update_library();
        }
        function draw_game(gameEntry, left) {
            try {
                const cfgPath = gameEntry[0];
                const json = JSON.parse(gameEntry[1]);
                const gameContainer = document.createElement("div");
                gameContainer.classList.add("game");
                const gameContentWrapper = document.createElement("table");
                gameContainer.appendChild(gameContentWrapper);
                const gameContent = document.createElement("tr");
                gameContentWrapper.appendChild(gameContent);
                const gameDetails = document.createElement("td");
                const launchWrapper = document.createElement("td");
                gameContent.appendChild(gameDetails);
                gameDetails.style.width = "100%";
                gameContent.appendChild(launchWrapper);

                const gameTitle = document.createElement("h3");
                const parts = json.GamePath.split("/");
                gameTitle.innerText = parts[parts.length - 1];
                gameDetails.appendChild(gameTitle);
                const gameInfo = document.createElement("small");
                gameInfo.innerText = `AppID: ${json.AppID} | ${json.Tags.join(", ")}`;
                gameDetails.appendChild(gameInfo);

                const launchBtn = document.createElement("button");
                launchBtn.classList.add("launch_btn");
                launchBtn.innerText = "Play";
                launchWrapper.appendChild(launchBtn);
                launchBtn.addEventListener("click", async ()=>{
                    if (launchBtn.classList.contains("disabled")) {
                        return;
                    }
                    launchBtn.classList.add("disabled");
                    await window.pywebview.api.launch_async(json);
                    launchBtn.classList.remove("disabled");
                });

                left.appendChild(gameContainer);
            } catch (error) {
                console.error(error);
            }
        }
        function redraw_games() {
            const left = document.querySelector("#left");
            const oldScroll = left.scrollTop;
            [...document.querySelectorAll(".game")].forEach(x => x.remove());

            Object.entries(games).forEach(ent => draw_game(ent, left));
        }
    </script>
</body>

</html>
